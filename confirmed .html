<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Email Confirmed - Make Your Own Questions</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: Arial, Helvetica, sans-serif;

        background: linear-gradient(135deg, #f5f3ff, #eef2ff);
        color: #1e1b4b;

        padding: 20px;
    }

    .confirmation-card {
        background: #ffffff;

        width: 90%;
        max-width: 450px;

        padding: 40px 30px;

        border-radius: 18px;

        text-align: center;

        box-shadow: 0 10px 35px rgba(79, 70, 229, 0.10);

        border: 1px solid #e5e7eb;
    }

    .icon {
        font-size: 55px;
        margin-bottom: 15px;
    }

    h1 {
        margin: 0 0 10px;

        color: #3730a3;

        font-size: 28px;
    }

    p {
        color: #555;

        line-height: 1.6;

        margin: 0 0 25px;

        font-size: 15px;
    }

    .login-button {
        display: inline-block;

        padding: 12px 24px;

        background: linear-gradient(135deg, #4f46e5, #7c3aed);

        color: white;

        text-decoration: none;

        border-radius: 9px;

        font-weight: 700;

        transition: 0.2s;
    }

    .login-button:hover {
        transform: translateY(-1px);

        box-shadow: 0 7px 18px rgba(79, 70, 229, 0.22);
    }

    .brand {
        margin-top: 22px;

        font-size: 13px;

        color: #9ca3af;

        font-weight: 600;
    }
</style>


</head>

<body>


<div class="confirmation-card">

    <div class="icon">
        ✅
    </div>

    <h1>
        Email Confirmed!
    </h1>

    <p>
        Your email has been successfully confirmed.
        You can now log in and start creating your own UPSC-style questions and QCABs.
    </p>

    <a
        href="make-questions.html"
        class="login-button"
    >
        Go to Make Your Questions
    </a>

    <div class="brand">
        DoomsDay QCAB Generator
    </div>

</div>


</body>
</html>
