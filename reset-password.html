<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Make Your Own Questions</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #1e1b4b;
        }

        .confirmation-card {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
            color: #3730a3;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin-bottom: 7px;
            color: #37334f;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd6fe;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
            box-sizing: border-box;
            background: #fafaff;
            color: #1e1b4b;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .login-button {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px 24px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #3730a3;
        }

        #message {
            margin-top: 18px;
            margin-bottom: 0;
            font-size: 14px;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="confirmation-card">

        <div class="icon">🔐</div>

        <h1>Reset Your Password</h1>

        <p>Enter your new password below.</p>

        <form id="resetForm">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter your new password"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your new password"
                autocomplete="new-password"
                required
            >

            <button
                type="submit"
                class="login-button"
                id="updateButton"
            >
                Update Password
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://suhcufvujmovwmougyzi.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_Ej6EKW2sVC8cvlh78fFAMQ_geNQgqWG";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        const resetForm =
            document.getElementById("resetForm");

        const updateButton =
            document.getElementById("updateButton");

        const message =
            document.getElementById("message");

        let recoverySessionReady = false;

        supabaseClient.auth.onAuthStateChange(
            async function (event, session) {

                if (event === "PASSWORD_RECOVERY") {

                    recoverySessionReady = true;

                    resetForm.style.display = "block";

                    return;
                }
            }
        );

        resetForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const newPassword =
                    document
                        .getElementById("newPassword")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;

                if (newPassword.length < 6) {

                    message.className = "error";

                    message.textContent =
                        "Password must be at least 6 characters.";

                    return;
                }

                if (newPassword !== confirmPassword) {

                    message.className = "error";

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }

                updateButton.disabled = true;

                updateButton.textContent =
                    "Updating Password...";

                message.className = "";

                message.textContent = "";

                const { error } =
                    await supabaseClient.auth.updateUser({

                        password: newPassword

                    });

                if (error) {

                    console.error(error);

                    message.className = "error";

                    message.textContent =
                        error.message;

                    updateButton.disabled = false;

                    updateButton.textContent =
                        "Update Password";

                    return;
                }

                message.className = "success";

                message.textContent =
                    "Password updated successfully. Please log in again.";

                resetForm.style.display = "none";

                await supabaseClient.auth.signOut();

                setTimeout(
                    function () {

                        window.location.replace(
                            "https://upscdoomsday.github.io/make-questions/"
                        );

                    },
                    1500
                );

            }
        );

    </script>

</body>
</html>
